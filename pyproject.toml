[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-planning"
version = "0.6.1"
description = "Online scheduling of verified aggregation over real TCP"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy>=1.24", "scipy>=1.14", "matplotlib>=3.7", "scikit-learn>=1.3", "cryptography>=41", "web3>=7.16,<8", "eth-tester[py-evm]==0.13.0b1", "py-ecc>=8,<9", "eth-hash[pycryptodome]>=0.8,<1"]

[project.optional-dependencies]
dev = ["ruff==0.17.3"]

[project.scripts]
adaptive-planning = "adaptive_planning.cli:main"

[tool.setuptools.packages.find]
include = ["adaptive_planning*", "legacy*"]
exclude = ["tests*", "work*", "results*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E9", "F401", "F841"]
