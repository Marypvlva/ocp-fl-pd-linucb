#cloud-config
users:
  - name: ubuntu
    groups: sudo
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ${ssh_key}
package_update: true
packages:
  - chrony
  - rsync
  - git
  - iproute2
  - build-essential
  - jq
write_files:
  - path: /etc/ssh/sshd_config.d/90-stand.conf
    content: |
      # The launcher multiplexes one SSH connection per host and opens one
      # session per role process; parallel episodes need many sessions.
      MaxSessions 256
      MaxStartups 200:30:400
  - path: /etc/sysctl.d/90-stand.conf
    content: |
      net.core.somaxconn = 4096
      net.ipv4.ip_local_port_range = 10240 65000
runcmd:
  - sysctl --system
  - systemctl restart ssh
  - systemctl enable --now chrony
  - sudo -u ubuntu bash -lc 'curl -LsSf https://astral.sh/uv/install.sh | sh'
  - sudo -u ubuntu bash -lc '~/.local/bin/uv python install 3.13'
%{ if netem_ms > 0 ~}
  - tc qdisc replace dev eth0 root netem delay ${netem_ms}ms ${netem_jitter_ms}ms distribution normal
%{ endif ~}
  - touch /var/lib/cloud/instance/stand-ready
